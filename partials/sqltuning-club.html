<!-- SQL튜닝 소모임 Panel -->
<section id="panel-sqltuning-textbook" class="content-panel">
  <div class="panel-header" style="margin-bottom: 10px;">
    <h3>SQL 튜닝 소모임</h3>
    <p class="panel-desc">현업 실무 중심의 SQL 튜닝 기법과 실행계획 최적화 스터디</p>
  </div>

  <div class="textbook-container bg-glass" style="height: calc(100vh - 160px); display: flex; flex-direction: column; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-light);">
    <div class="textbook-inner-tabs" id="sqltuning-tabs" style="display: flex; flex-shrink: 0; border-bottom: 1px solid var(--border-light); background: var(--bg-textbook-tab); padding: 0 10px; overflow-x: auto;">
      <button class="tbook-tab active" data-target="sqltuning-session1" style="padding: 12px 20px; background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; font-weight: 700; color: var(--sph-slate); font-size: 0.82rem; white-space: nowrap;">1회차 · SQL기본 & 플랜제어</button>
      <button class="tbook-tab" data-target="sqltuning-session2" style="padding: 12px 20px; background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; font-weight: 700; color: var(--sph-slate); font-size: 0.82rem; white-space: nowrap;">2회차 · 해시 조인과 메모리</button>
      <button class="tbook-tab" data-target="sqltuning-session3" style="padding: 12px 20px; background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; font-weight: 700; color: var(--sph-slate); font-size: 0.82rem; white-space: nowrap;">3회차 · ASH/AWR 역추적</button>
      <button class="tbook-tab" data-target="sqltuning-session4" style="padding: 12px 20px; background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; font-weight: 700; color: var(--sph-slate); font-size: 0.82rem; white-space: nowrap;">4회차 · 파티셔닝 & 병렬 튜닝</button>
    </div>

    <!-- 1회차 -->
    <div class="textbook-tab-contents active" id="sqltuning-session1" style="padding: 30px; flex-grow: 1; overflow-y: auto; background: var(--bg-textbook);">
      <div id="viewer-sqltuning-1" class="markdown-body">
        <div style="text-align:center;padding:40px;color:var(--color-text-muted);">
          <div class="loader" style="margin:0 auto 10px;width:24px;height:24px;border:3px solid var(--border-light);border-top-color:var(--accent-cyan);border-radius:50%;animation:spin 1s linear infinite;"></div>
          강의자료를 불러오는 중입니다...
        </div>
      </div>
    </div>

    <!-- 2회차 -->

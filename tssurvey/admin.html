<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설문 관리자 - SPHAROS</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .sph-slide-container { max-width: 1280px !important; }
    </style>
</head>
<body>
    <div id="loginOverlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:var(--sph-bg); z-index:9999; display:flex; align-items:center; justify-content:center; flex-direction:column;">
        <h2 class="sph-h2" style="margin-bottom: 24px;">관리자 인증</h2>
        <input type="password" id="adminPassword" class="sph-input" placeholder="비밀번호" style="margin-bottom: 16px; width: 250px;">
        <button id="btnLogin" class="sph-btn sph-btn--primary" style="width: 250px;">입장하기</button>
    </div>

    <div class="sph-slide-container" id="adminMain" style="display:none;">
        <header class="sph-header">
            <p class="sph-kicker">기술서비스팀 설문</p>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h1 class="sph-title" style="margin:0;">설문 관리 대시보드</h1>
                <div>
                    <button class="sph-btn sph-btn--ghost" onclick="loadTopics()">🔄 새로고침</button>
                    <button class="sph-btn sph-btn--ghost" onclick="logout()" style="margin-left:8px;">로그아웃</button>
                </div>
            </div>
            <div class="sph-keymsg" style="margin-top:24px;">
                <span class="label">안내</span>
                새로운 설문 주제를 생성하고, 등록된 익명 응답 결과(별점, 한줄의견)를 조회할 수 있습니다.
            </div>
        </header>

        <main class="sph-main">
            <div class="sph-card sph-card--accent">
                <h3 class="sph-h3" style="margin-top:0;">신규 주제 생성</h3>
                <div style="margin-top: 16px; margin-bottom: 8px;">
                    <label style="margin-right: 16px; cursor: pointer;"><input type="radio" name="topicType" value="survey" checked> 설문조사</label>
                    <label style="cursor: pointer;"><input type="radio" name="topicType" value="apply"> 지원서 양식</label>
                </div>
                <div style="display:flex; gap:12px;">
                    <input type="text" id="topicTitleInput" class="sph-input" placeholder="예: 7월 DB 성능진단 교육 만족도 조사" style="flex:1;">
                    <button id="btnCreateTopic" class="sph-btn sph-btn--primary">주제 생성</button>
                </div>
            </div>

            <h2 class="sph-h2" style="margin-top: 32px; margin-bottom: 16px;">주제 목록</h2>
            <table class="sph-table" id="topicsTable">
                <thead>
                    <tr>
                        <th>유형</th>
                        <th>주제명</th>
                        <th>생성일</th>
                        <th>응답수</th>
                        <th>평균 별점</th>
                        <th>동작</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- JS Rendering -->
                </tbody>
            </table>

            <div id="responseView" style="display: none; margin-top: 40px;">
                <h2 class="sph-h2" id="responseTitle">응답 내역</h2>
                <div class="sph-card">
                    <table class="sph-table" id="responsesTable">
                        <thead>
                            <tr>
                                <th style="width: 120px;">별점</th>
                                <th>한줄의견</th>
                                <th style="width: 180px;">제출일시</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- JS Rendering -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>


    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('tssurvey_admin_token');
            if (token) {
                try {
                    await suvApi.checkAuth(token);
                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('adminMain').style.display = 'block';
                    loadTopics();
                } catch (e) {
                    // Invalid token
                }
            }

            document.getElementById('btnLogin').addEventListener('click', async () => {
                const pwd = document.getElementById('adminPassword').value;
                if (!pwd) return;
                try {
                    await suvApi.checkAuth(pwd);
                    suvApi.setToken(pwd);
                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('adminMain').style.display = 'block';
                    loadTopics();
                } catch (e) {
                    alert('비밀번호가 올바르지 않습니다.');
                }
            });

            document.getElementById('adminPassword').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') document.getElementById('btnLogin').click();
            });

            document.getElementById('btnCreateTopic').addEventListener('click', async () => {
                const titleInput = document.getElementById('topicTitleInput');
                const title = titleInput.value.trim();
                const typeInput = document.querySelector('input[name="topicType"]:checked');
                const type = typeInput ? typeInput.value : 'survey';
                
                if (!title) {
                    alert('주제를 입력하세요.');
                    return;
                }

                try {
                    await suvApi.createTopic(title, type);
                    titleInput.value = '';
                    alert('주제가 생성되었습니다.');
                    loadTopics();
                } catch (e) {
                    alert('생성 실패: ' + e.message);
                }
            });
        });

        async function loadTopics() {
            try {
                const topics = await suvApi.getTopics();
                const tbody = document.querySelector('#topicsTable tbody');
                tbody.innerHTML = '';
                
                if (topics.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">등록된 주제가 없습니다.</td></tr>';
                    return;
                }

                topics.forEach(t => {
                    const tr = document.createElement('tr');
                    
                    const typeBadge = t.TOPIC_TYPE === 'apply' 
                        ? `<span class="badge badge-apply">지원서</span>`
                        : `<span class="badge badge-survey">설문</span>`;
                    
                    const activeBadge = t.IS_ACTIVE 
                        ? `<span style="background:var(--sph-tint-blue); color:var(--sph-navy); font-size:12px; padding:2px 6px; border-radius:4px; margin-left:8px; vertical-align:middle;">🟢 진행 중</span>`
                        : `<span style="background:#FEE2E2; color:#991B1B; font-size:12px; padding:2px 6px; border-radius:4px; margin-left:8px; vertical-align:middle;">🔴 마감됨</span>`;
                    
                    let starAvgHtml = '';
                    if (t.TOPIC_TYPE === 'apply') {
                        starAvgHtml = '-';
                    } else {
                        const avg = t.AVG_STARS ? Number(t.AVG_STARS).toFixed(1) : '0.0';
                        starAvgHtml = `<span style="color:var(--sph-yellow); font-weight:bold;">★ ${avg}</span>`;
                    }

                    const toggleBtnLabel = t.IS_ACTIVE ? '마감' : '오픈';
                    const toggleBtnStyle = t.IS_ACTIVE 
                        ? 'border:1px solid #991B1B; color:#991B1B; margin-left:4px;' 
                        : 'border:1px solid var(--sph-navy); color:var(--sph-navy); margin-left:4px;';
                    const targetIsActive = t.IS_ACTIVE ? 0 : 1;

                    tr.innerHTML = `
                        <td>${typeBadge}</td>
                        <td style="font-weight:700;">${t.TITLE}${activeBadge}</td>
                        <td>${formatKST(t.CREATED_AT)}</td>
                        <td style="font-weight:bold; color:var(--sph-navy);"><span style="background:var(--sph-ink); color:#fff; border-radius:50%; width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center; font-size:12px;">${t.RESPONSE_COUNT}</span></td>
                        <td>${starAvgHtml}</td>
                        <td>
                            <button class="sph-btn sph-btn--ghost" onclick="viewResponses('${t.ID}', '${t.TITLE.replace(/'/g, "\\'")}', '${t.TOPIC_TYPE}')">결과 보기</button>
                            <a href="${t.TOPIC_TYPE === 'apply' ? 'apply.html' : 'index.html'}?topic_id=${t.ID}" target="_blank" class="sph-btn sph-btn--primary" style="margin-left: 4px; text-decoration:none;">입장</a>
                            <button class="sph-btn sph-btn--ghost" style="${toggleBtnStyle}" onclick="toggleTopicStatus('${t.ID}', ${targetIsActive})">${toggleBtnLabel}</button>
                            <button class="sph-btn sph-btn--ghost" style="border: 1px solid #dc3545; color:#dc3545; margin-left: 4px;" onclick="deleteTopic('${t.ID}')">삭제</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error(e);
            }
        }

        async function viewResponses(topicId, title, topicType) {
            const resView = document.getElementById('responseView');
            const resTitle = document.getElementById('responseTitle');
            const tbody = document.querySelector('#responsesTable tbody');
            const thead = document.querySelector('#responsesTable thead');
            
            resTitle.textContent = `[${title}] 응답 내역`;
            resView.style.display = 'block';
            
            if (topicType === 'apply') {
                thead.innerHTML = `<tr><th style="width: 150px;">부서</th><th style="width: 120px;">성명</th><th>의견</th><th style="width: 180px;">제출일시</th></tr>`;
            } else {
                thead.innerHTML = `<tr><th style="width: 120px;">별점</th><th>한줄의견</th><th style="width: 180px;">제출일시</th></tr>`;
            }
            
            tbody.innerHTML = `<tr><td colspan="${topicType === 'apply' ? 4 : 3}">로딩 중...</td></tr>`;
            
            // Scroll to view
            resView.scrollIntoView({ behavior: 'smooth' });

            try {
                const responses = await suvApi.getResponses(topicId);
                tbody.innerHTML = '';
                
                if (responses.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="${topicType === 'apply' ? 4 : 3}" style="text-align:center;">응답 내역이 없습니다.</td></tr>`;
                    return;
                }

                responses.forEach(r => {
                    const tr = document.createElement('tr');
                    const dateStr = formatKST(r.SUBMITTED_AT);
                    
                    if (topicType === 'apply') {
                        tr.innerHTML = `
                            <td><strong>${escapeHtml(r.DEPARTMENT || '')}</strong></td>
                            <td>${escapeHtml(r.NAME || '')}</td>
                            <td>${r.COMMENT ? escapeHtml(r.COMMENT) : '<span class="sph-caption">(의견 없음)</span>'}</td>
                            <td class="sph-caption">${dateStr}</td>
                        `;
                    } else {
                        const stars = '★'.repeat(r.STAR_RATING) + '☆'.repeat(5 - r.STAR_RATING);
                        tr.innerHTML = `
                            <td style="color:var(--sph-yellow); font-size:16px;">${stars}</td>
                            <td>${r.COMMENT ? escapeHtml(r.COMMENT) : '<span class="sph-caption">(의견 없음)</span>'}</td>
                            <td class="sph-caption">${dateStr}</td>
                        `;
                    }
                    tbody.appendChild(tr);
                });
            } catch (e) {
                if (e.message.includes('401')) {
                    alert('인증이 만료되었습니다. 다시 로그인해주세요.');
                    logout();
                    return;
                }
                tbody.innerHTML = `<tr><td colspan="${topicType === 'apply' ? 4 : 3}" style="color:red;">조회 실패: ${e.message}</td></tr>`;
            }
        }

        async function deleteTopic(topicId) {
            if (!confirm('정말 이 설문 주제와 모든 응답 내역을 삭제하시겠습니까?')) return;
            try {
                await suvApi.deleteTopic(topicId);
                alert('삭제되었습니다.');
                loadTopics();
                document.getElementById('responseView').style.display = 'none';
            } catch (e) {
                if (e.message.includes('401')) {
                    alert('권한이 없습니다.');
                    return;
                }
                alert('삭제 실패: ' + e.message);
            }
        }

        async function toggleTopicStatus(topicId, isActive) {
            const msg = isActive ? '이 항목을 다시 진행 상태로 오픈하시겠습니까?' : '이 항목의 접수를 마감하시겠습니까?';
            if (!confirm(msg)) return;
            try {
                await suvApi.toggleTopicStatus(topicId, isActive);
                loadTopics();
            } catch (e) {
                if (e.message.includes('401')) {
                    alert('권한이 없습니다.');
                    return;
                }
                alert('상태 변경 실패: ' + e.message);
            }
        }

        function logout() {
            suvApi.logout();
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('adminMain').style.display = 'none';
            document.getElementById('adminPassword').value = '';
        }

        function formatKST(dateString) {
            if (!dateString) return '';
            let dStr = dateString;
            // 서버가 UTC 기준으로 naive datetime을 저장한 경우(Z나 +가 없음), UTC로 간주하도록 'Z'를 붙임
            if (!dStr.endsWith('Z') && !dStr.includes('+')) {
                dStr += 'Z';
            }
            return new Date(dStr).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' });
        }

        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>

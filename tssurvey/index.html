<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>익명 설문조사</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .survey-success {
            display: none;
            text-align: center;
            padding: 40px 0;
        }
        .survey-success .icon {
            font-size: 64px;
            color: var(--sph-yellow);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="sph-slide-container">
        <header class="sph-header">
            <p class="sph-kicker">기술서비스팀 설문</p>
            <h1 class="sph-title" id="displayTopicTitle">익명 설문조사</h1>
            <div class="sph-keymsg">
                <span class="label">안내</span>
                본 설문은 완전히 익명으로 처리되며, 여러분의 소중한 의견은 더 나은 활동을 위해 활용됩니다.
            </div>
        </header>

        <main class="sph-main">
            <div id="surveyForm" class="sph-card">
                <div class="sph-form-group">
                    <label class="sph-label">1. 전반적인 만족도를 별점으로 평가해 주세요.</label>
                    <div class="sph-star-rating" style="margin-top: 12px; justify-content: flex-end;">
                        <input type="radio" id="star5" name="rating" value="5" />
                        <label for="star5" title="5점">★</label>
                        <input type="radio" id="star4" name="rating" value="4" />
                        <label for="star4" title="4점">★</label>
                        <input type="radio" id="star3" name="rating" value="3" />
                        <label for="star3" title="3점">★</label>
                        <input type="radio" id="star2" name="rating" value="2" />
                        <label for="star2" title="2점">★</label>
                        <input type="radio" id="star1" name="rating" value="1" />
                        <label for="star1" title="1점">★</label>
                    </div>
                </div>

                <div class="sph-form-group" style="margin-top: 32px;">
                    <label class="sph-label" for="comment">2. 자유로운 한줄의견을 남겨주세요. (최대 400자)</label>
                    <textarea id="comment" class="sph-textarea" rows="4" maxlength="400" placeholder="좋았던 점, 아쉬웠던 점, 건의사항 등 자유롭게 작성해 주세요."></textarea>
                    <div style="text-align: right; margin-top: 8px;">
                        <span id="charCount" class="sph-caption">0 / 400 자</span>
                    </div>
                </div>

                <div style="text-align: center; margin-top: 40px;">
                    <button id="btnSubmit" class="sph-btn sph-btn--primary" style="min-width: 200px;">설문 제출하기</button>
                </div>
            </div>

            <div id="surveySuccess" class="survey-success">
                <div class="icon">★</div>
                <h2 class="sph-h2">제출이 완료되었습니다!</h2>
                <p style="color: var(--sph-slate); margin-top: 12px; line-height: 1.6;">
                    소중한 의견 감사드립니다.<br>
                    창을 닫으셔도 좋습니다.
                </p>
            </div>
            
            <div id="errorContainer" style="display:none; color:red; font-weight:bold; text-align:center; padding: 40px;">
                잘못된 접근입니다. (설문 주제 ID 누락)
            </div>
        </main>


    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const topicId = urlParams.get('topic_id');

            if (!topicId) {
                document.getElementById('surveyForm').style.display = 'none';
                document.getElementById('errorContainer').style.display = 'block';
                return;
            }

            // Optionally, we could fetch the topic title to display it.
            // For now, we'll just let the user fill out the form.
            try {
                // Fetch topics to verify topic_id exists and get its title
                suvApi.getTopics().then(topics => {
                    const topic = topics.find(t => t.ID === topicId);
                    if (topic) {
                        document.getElementById('displayTopicTitle').textContent = topic.TITLE;
                        if (!topic.IS_ACTIVE) {
                            document.getElementById('surveyForm').style.display = 'none';
                            const closedMsg = document.createElement('div');
                            closedMsg.innerHTML = `
                                <div style="padding: 60px 20px; text-align:center;">
                                    <div style="font-size: 48px; margin-bottom: 16px;">🔒</div>
                                    <h2 class="sph-h2">이 설문조사는 마감되었습니다.</h2>
                                    <p style="color: var(--sph-slate); margin-top: 12px; line-height: 1.6;">
                                        더 이상 응답을 제출할 수 없습니다.
                                    </p>
                                </div>
                            `;
                            document.getElementById('surveyForm').parentNode.appendChild(closedMsg);
                        }
                        
                        if (topic.REQUIRE_STAR === 0) {
                            const starRatingDiv = document.querySelector('.sph-star-rating');
                            if (starRatingDiv) {
                                starRatingDiv.parentElement.style.display = 'none';
                            }
                            const commentLabel = document.querySelector('label[for="comment"]');
                            if (commentLabel) {
                                commentLabel.textContent = commentLabel.textContent.replace('2. ', '');
                            }
                            window.survRequireStar = false;
                        } else {
                            window.survRequireStar = true;
                        }
                    } else {
                        document.getElementById('surveyForm').style.display = 'none';
                        const err = document.getElementById('errorContainer');
                        err.style.display = 'block';
                        err.textContent = '존재하지 않거나 비활성화된 설문입니다.';
                        return;
                    }
                }).catch(e => console.error(e));
            } catch (e) {
                console.error('Failed to fetch topics:', e);
            }

            const commentInput = document.getElementById('comment');
            const charCount = document.getElementById('charCount');

            commentInput.addEventListener('input', () => {
                charCount.textContent = `${commentInput.value.length} / 400 자`;
            });

            document.getElementById('btnSubmit').addEventListener('click', async () => {
                const ratingInput = document.querySelector('input[name="rating"]:checked');
                let starRating = 0;
                
                if (window.survRequireStar !== false) {
                    if (!ratingInput) {
                        alert('별점을 선택해 주세요.');
                        return;
                    }
                    starRating = parseInt(ratingInput.value, 10);
                }
                
                const comment = commentInput.value.trim();

                try {
                    await suvApi.submitResponse(topicId, starRating, comment);
                    
                    document.getElementById('surveyForm').style.display = 'none';
                    document.getElementById('surveySuccess').style.display = 'block';
                } catch (e) {
                    alert('제출 중 오류가 발생했습니다: ' + e.message);
                }
            });
        });
    </script>
</body>
</html>
